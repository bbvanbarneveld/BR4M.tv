name: Update YouTube gallery

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch latest long-form uploads
        run: node scripts/fetch-videos.mjs
      - name: Commit if the gallery changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          if git diff --cached --quiet; then
            echo "Gallery already up to date"
          else
            git commit -m "Update YouTube gallery from channel feed"
            git push
          fi
