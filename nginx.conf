server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 404 /404.html;

    location = /discord { return 302 https://discord.gg/Unb7Y2GxNT; }
    location = /discord/ { return 302 https://discord.gg/Unb7Y2GxNT; }
    location = /youtube { return 302 https://www.youtube.com/@br4mtv; }
    location = /youtube/ { return 302 https://www.youtube.com/@br4mtv; }
    location = /tiktok { return 302 https://www.tiktok.com/@br4m.tv; }
    location = /tiktok/ { return 302 https://www.tiktok.com/@br4m.tv; }
    location = /doneer { return 302 /donate; }
    location = /doneer/ { return 302 /donate; }
    location = /doneer.html { return 302 /donate; }
    location = /watch { return 302 /movies; }
    location = /watch/ { return 302 /movies; }
    location = /projects { return 302 /movies; }
    location = /projects/ { return 302 /movies; }

    location ~ ^/movies/[^/]+/?$ {
        try_files $uri $uri.html /movies.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
