server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/markdown
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header TDM-Reservation "0" always;
    add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;

    error_page 404 /404.html;

    location = /discord { return 302 https://discord.gg/Unb7Y2GxNT; }
    location = /discord/ { return 302 https://discord.gg/Unb7Y2GxNT; }
    location = /youtube { return 302 https://www.youtube.com/@br4mtv; }
    location = /youtube/ { return 302 https://www.youtube.com/@br4mtv; }
    location = /tiktok { return 302 https://www.tiktok.com/@br4m.tv; }
    location = /tiktok/ { return 302 https://www.tiktok.com/@br4m.tv; }
    location = /doneer { return 302 /donate; }
    location = /doneer/ { return 302 /donate; }
    location = /doneer.html { return 302 /donate; }
    location = /watch { return 302 /movies; }
    location = /watch/ { return 302 /movies; }
    location = /projects { return 302 /movies; }
    location = /projects/ { return 302 /movies; }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        add_header TDM-Reservation "0" always;
        add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files $uri =404;
    }

    location ~ ^/movies/[^/]+/?$ {
        try_files $uri $uri.html /movies.html;
    }

    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=3600";
        add_header TDM-Reservation "0" always;
        try_files $uri =404;
    }

    location = /.well-known/tdmrep.json {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
