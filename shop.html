<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>BR4M Shop</title>
    <meta name="description" content="Official BR4M pieces. Secure checkout by Fourthwall." />
    <link rel="canonical" href="https://br4m.tv/shop" />
    <meta property="og:title" content="BR4M Shop" />
    <meta property="og:description" content="Official BR4M pieces. Secure checkout by Fourthwall." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://br4m.tv/shop" />
    <meta property="og:image" content="https://br4m.tv/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BR4M Shop" />
    <meta name="twitter:description" content="Official BR4M pieces. Secure checkout by Fourthwall." />
    <meta name="twitter:image" content="https://br4m.tv/share.jpg" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('js')
    </script>
    <style>
      /* Critical: black out the screen until the stylesheet arrives, so raw
         HTML never flashes. The page reveal (or a timed fallback) opens it. */
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
      }
      html.js .bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 50.5vh;
        background: #000;
        z-index: 45;
        animation: bar-fallback 0.8s ease 4s forwards;
      }
      html.js .bar--top { top: 0; }
      html.js .bar--bottom { bottom: 0; }
      @keyframes bar-fallback { to { height: 0; } }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div class="fx" aria-hidden="true">
      <div class="fx__grain"></div>
      <div class="fx__vignette"></div>
    </div>

    <div class="bar bar--top" data-bar aria-hidden="true"></div>
    <div class="bar bar--bottom" data-bar aria-hidden="true"></div>

    <div class="cursor" data-cursor aria-hidden="true">
      <span class="cursor__ring"><span class="cursor__label" data-cursor-label></span></span>
      <span class="cursor__dot"></span>
    </div>

    <div class="progress" aria-hidden="true"><i data-progress></i></div>

    <header class="topbar" data-topbar>
      <a class="topbar__mark" href="/" aria-label="BR4M home">BR<i>4</i>M</a>
      <span class="timecode topbar__clock" data-clock></span>

      <nav class="topbar__nav" aria-label="Pages">
        <a class="ulink" href="/movies">Movies</a>
        <a class="ulink" href="/shop" aria-current="page">Shop</a>
        <a class="ulink" href="/donate">Support</a>
      </nav>

      <div class="topbar__tools">
        <button class="icon-btn" type="button" data-open-bag hidden aria-label="Open bag">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6.4 8.4h11.2l.8 11.9H5.6zM9 8.4V6.8a3 3 0 0 1 6 0v1.6"
            />
          </svg>
          <span class="count" data-bag-count hidden>0</span>
        </button>
        <button
          class="icon-btn burger"
          type="button"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="menu"
          aria-label="Open menu"
        >
          <i></i>
          <i></i>
        </button>
      </div>
    </header>

    <nav class="drawer" id="menu" data-menu aria-label="Menu">
      <a href="/">Home</a>
      <a href="/movies">Movies</a>
      <a href="/shop" aria-current="page">Shop</a>
      <a href="/donate">Support</a>
    </nav>

    <main id="main">
      <header class="page-hero shell">
        <div class="page-hero__row">
          <h1 class="page-title" data-load>Shop</h1>
          <div class="sec-head__aside" data-load>
            <div data-currency-mount></div>
            <button class="ulink" type="button" data-open-bag hidden data-magnetic>
              Bag
              <span class="count" data-bag-count hidden>0</span>
            </button>
          </div>
        </div>
      </header>

      <section class="band-bottom shell">
        <div data-shop></div>
      </section>
    </main>

    <footer class="foot">
      <div class="shell">
        <a class="foot__mark" href="/" aria-label="BR4M home" data-reveal>BR<i>4</i>M</a>

        <div class="foot__grid">
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>Pages</h3>
            <a href="/movies">Movies</a>
            <a href="/">Home</a>
            <a href="/donate">Support</a>
            <a href="/press">Press</a>
          </div>
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>Channels</h3>
            <a href="/youtube" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="/discord" target="_blank" rel="noopener noreferrer">Discord</a>
            <a href="/tiktok" target="_blank" rel="noopener noreferrer">TikTok</a>
            <a href="https://br4m-shop.fourthwall.com/pages/memberships" target="_blank" rel="noopener noreferrer">
              Membership
            </a>
          </div>
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>BR4M</h3>
            <p>Written, built and filmed inside Minecraft.</p>
            <p>Secure checkout is hosted by Fourthwall.</p>
          </div>
        </div>

        <div class="foot__bar">
          <p>© <span data-year>2026</span> BR4M</p>
          <p class="timecode" data-clock></p>
        </div>
      </div>
    </footer>

    <dialog class="sheet sheet--wide" data-product-sheet aria-label="Product" data-lenis-prevent></dialog>
    <dialog class="sheet" data-bag-sheet aria-label="Bag" data-lenis-prevent></dialog>

    <script type="module" src="/src/shop-page.js"></script>
  </body>
</html>
