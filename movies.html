<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>BR4M Movies</title>
    <meta
      name="description"
      content="Every BR4M movie and series made inside Minecraft, with release dates and premieres. The First Word premieres 30.08.2026 at 15:00 CEST."
    />
    <link rel="canonical" href="https://br4m.tv/movies" />
    <meta property="og:title" content="BR4M Movies" />
    <meta
      property="og:description"
      content="Every BR4M movie and series made inside Minecraft, with release dates and premieres. The First Word premieres 30.08.2026 at 15:00 CEST."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://br4m.tv/movies" />
    <meta property="og:image" content="https://br4m.tv/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BR4M Movies" />
    <meta
      name="twitter:description"
      content="Every BR4M movie and series made inside Minecraft, with release dates and premieres. The First Word premieres 30.08.2026 at 15:00 CEST."
    />
    <meta name="twitter:image" content="https://br4m.tv/share.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Movie",
        "name": "The First Word",
        "isPartOf": { "@type": "MovieSeries", "name": "The Architects" },
        "description": "Three command blocks. Three hidden locations. Whoever holds all three can rewrite the world.",
        "image": "https://br4m.tv/projects/the-architects-poster.png",
        "datePublished": "2026-08-30T15:00:00+02:00",
        "url": "https://br4m.tv/movies/the-architects"
      }
    </script>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" as="image" href="/projects/the-architects-hero.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Climate+Crisis&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('js')
    </script>
    <style>
      /* Critical: black out the screen until the stylesheet arrives, so raw
         HTML never flashes. The page reveal (or a timed fallback) opens it. */
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
      }
      html.js .bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 50.5vh;
        background: #000;
        z-index: 45;
        animation: bar-fallback 0.8s ease 4s forwards;
      }
      html.js .bar--top { top: 0; }
      html.js .bar--bottom { bottom: 0; }
      @keyframes bar-fallback { to { height: 0; } }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div class="fx" aria-hidden="true">
      <div class="fx__grain"></div>
      <div class="fx__vignette"></div>
    </div>

    <div class="bar bar--top" data-bar aria-hidden="true"></div>
    <div class="bar bar--bottom" data-bar aria-hidden="true"></div>

    <div class="cursor" data-cursor aria-hidden="true">
      <span class="cursor__ring"><span class="cursor__label" data-cursor-label></span></span>
      <span class="cursor__dot"></span>
    </div>

    <div class="progress" aria-hidden="true"><i data-progress></i></div>

    <header class="topbar" data-topbar>
      <a class="topbar__mark" href="/" aria-label="BR4M home">BR<i>4</i>M</a>
      <span class="timecode topbar__clock" data-clock></span>

      <nav class="topbar__nav" aria-label="Pages">
        <a class="ulink" href="/movies" aria-current="page">Movies</a>
        <a class="ulink" href="/shop">Shop</a>
        <a class="ulink" href="/donate">Support</a>
      </nav>

      <div class="topbar__tools">
        <button
          class="icon-btn burger"
          type="button"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="menu"
          aria-label="Open menu"
        >
          <i></i>
          <i></i>
        </button>
      </div>
    </header>

    <nav class="drawer" id="menu" data-menu aria-label="Menu">
      <a href="/">Home</a>
      <a href="/movies" aria-current="page">Movies</a>
      <a href="/shop">Shop</a>
      <a href="/donate">Support</a>
    </nav>

    <main id="main">
      <section class="feature feature--hub" data-feature></section>
      <div class="hub" data-hub></div>
      <section data-project-detail hidden></section>
    </main>

    <footer class="foot">
      <div class="shell">
        <a class="foot__mark" href="/" aria-label="BR4M home" data-reveal>BR<i>4</i>M</a>

        <div class="foot__grid">
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>Pages</h3>
            <a href="/">Home</a>
            <a href="/shop">Shop</a>
            <a href="/donate">Support</a>
            <a href="/press">Press</a>
          </div>
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>Channels</h3>
            <a href="/youtube" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="/discord" target="_blank" rel="noopener noreferrer">Discord</a>
            <a href="/tiktok" target="_blank" rel="noopener noreferrer">TikTok</a>
            <a href="https://br4m-shop.fourthwall.com/pages/memberships" target="_blank" rel="noopener noreferrer">
              Membership
            </a>
          </div>
          <div class="foot__col" data-reveal data-reveal-stagger>
            <h3>BR4M</h3>
            <p>Written, built and filmed inside Minecraft.</p>
            <p>Release times follow BR4M's local clock below.</p>
          </div>
        </div>

        <div class="foot__bar">
          <p>© <span data-year>2026</span> BR4M</p>
          <p class="timecode" data-clock></p>
        </div>
      </div>
    </footer>

    <dialog class="stage" data-stage aria-label="Player" data-lenis-prevent>
      <div class="stage__shell" data-stage-shell>
      <div class="stage__tools">
        <button class="stage__ctrl" type="button" data-stage-full aria-label="Full screen"></button>
        <button class="stage__close icon-btn" type="button" data-close aria-label="Close player"></button>
      </div>
      <div class="stage__screen" data-stage-screen>
        <img class="stage__poster" data-stage-poster alt="" hidden />
        <div class="stage__mount" data-stage-mount></div>
        <div class="stage__hit" data-stage-hit></div>
        <p class="stage__ad" data-stage-ad hidden>Ad</p>
        <button class="stage__big" type="button" data-stage-big aria-label="Play">
          <span class="stage__big-disc"></span>
        </button>
        <div class="stage__dock" data-stage-dock>
          <div class="stage__meta">
            <p class="stage__title" data-stage-title></p>
            <div class="stage__social">
              <a
                class="stage__out"
                data-stage-like
                target="_blank"
                rel="noopener noreferrer"
                hidden
                aria-label="Like on YouTube"
              ></a>
              <a
                class="stage__out"
                data-stage-comment
                target="_blank"
                rel="noopener noreferrer"
                hidden
                aria-label="Comment on YouTube"
              ></a>
            </div>
          </div>
          <div class="stage__row">
            <button class="stage__ctrl" type="button" data-stage-toggle aria-label="Play"></button>
            <div
              class="stage__scrub"
              data-stage-scrub
              role="slider"
              aria-label="Position"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
              tabindex="0"
            >
              <i data-stage-fill></i>
            </div>
            <span class="stage__time"><span data-stage-now>0:00</span> / <span data-stage-end>0:00</span></span>
            <button class="stage__ctrl" type="button" data-stage-mute aria-label="Turn sound on"></button>
            <button class="stage__ctrl" type="button" data-stage-full-dock aria-label="Full screen"></button>
          </div>
        </div>
      </div>
      </div>
    </dialog>

    <script type="module" src="/src/projects-page.js"></script>
  </body>
</html>
