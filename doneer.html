<!doctype html>
<html lang="nl-NL">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"

    <link rel="icon" href="/logo.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=DM+Sans:wght@400;500;600;700&display=swap"

  <body class="is-intro">

        data-colors="#6D28D9,#C900FF,#EA580C,#FF5A1F,#0F766E,#1EECC4"

        data-noise="0"

              <span class="cta-signal__label">Terug</span>
            </span>
            <span class="cta-signal__rail" aria-hidden="true"></span>

        </div>

    </main>

    <footer class="site-footer">
